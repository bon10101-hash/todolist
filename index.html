<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 할 일</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a6321f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할일">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ece5d3;
    --paper-dark: #e0d8c2;
    --ink: #23262f;
    --ink-soft: #6f6a5c;
    --line: #cfc4a4;
    --stamp: #a6321f;
    --stamp-dark: #7e2416;
    --shadow: rgba(35, 26, 10, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper-dark);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,0.05), transparent 45%);
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  .pad {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
    position: relative;
    padding: 34px 26px 26px;
    overflow: hidden;
  }

  /* 스프링 노트 느낌의 구멍 */
  .rings {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 34px;
  }
  .rings span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--paper-dark);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.35);
  }

  header {
    margin-top: 20px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px;
  }

  .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 4px 0 10px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--stamp);
    width: 0%;
    transition: width 0.35s ease;
  }
  .progress-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .add-row input {
    flex: 1;
    border: none;
    border-bottom: 2px dashed var(--line);
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 16px;
    padding: 10px 4px;
    color: var(--ink);
  }
  .add-row input:focus {
    outline: none;
    border-bottom-color: var(--stamp);
  }
  .add-row input::placeholder { color: #a8a190; }

  .add-row button {
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    padding: 0 18px;
    border-radius: 4px;
    cursor: pointer;
  }
  .add-row button:focus-visible,
  input:focus-visible,
  .task input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 2px;
  }
  .add-row button:active { transform: translateY(1px); }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 8px;
    margin: 0 -8px;
    border-radius: 8px;
    position: relative;
    transition: background-color 0.18s ease, opacity 0.25s ease;
  }
  .task + .task { border-top: 1px solid var(--line); }
  .task:hover { background-color: rgba(255,255,255,0.32); }
  .task.done { opacity: 0.72; }

  .check-wrap {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
  }

  .check-wrap input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }

  .circle {
    position: absolute;
    inset: 0;
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
  }

  /* 도장 - 체크 전엔 숨겨져 있다가 체크 시 쾅 찍힘 */
  .stamp {
    position: absolute;
    inset: -6px;
    border: 3px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--stamp);
    opacity: 0;
    transform: scale(1.6) rotate(-12deg);
    pointer-events: none;
  }

  .check-wrap input:checked ~ .circle { border-color: transparent; }
  .check-wrap input:checked ~ .stamp {
    animation: stampIn 0.32s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  @keyframes stampIn {
    0% { opacity: 0; transform: scale(1.8) rotate(-18deg); }
    60% { opacity: 1; transform: scale(0.92) rotate(-6deg); }
    100% { opacity: 1; transform: scale(1) rotate(-8deg); }
  }

  .task-text {
    flex: 1;
    font-size: 16px;
    line-height: 1.4;
    word-break: break-word;
    transition: color 0.2s ease;
  }
  .task.done .task-text {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--stamp);
    text-decoration-thickness: 1.5px;
  }

  .remove-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .remove-btn:hover { color: var(--stamp); background-color: rgba(166,50,31,0.12); }

  /* 사진 첨부 버튼 & 폴라로이드 썸네일 */
  .photo-slot {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
  }

  .photo-add {
    width: 100%;
    height: 100%;
    border: 2px dashed var(--line);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 15px;
    background: rgba(255,255,255,0.3);
  }
  .photo-add:hover { border-color: var(--stamp); color: var(--stamp); }

  .polaroid {
    width: 100%;
    height: 100%;
    background: #fff;
    padding: 3px 3px 6px;
    border-radius: 2px;
    box-shadow: 0 3px 6px rgba(35,26,10,0.28);
    transform: rotate(var(--tilt, -4deg));
    display: block;
  }
  .polaroid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 1px;
  }

  /* 사진 확대보기 오버레이 */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 8, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 50;
  }
  .lightbox[hidden] { display: none; }

  .lightbox-card {
    background: #fff;
    padding: 10px 10px 16px;
    border-radius: 3px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .lightbox-card img {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
    background: #f2f0ea;
  }
  .lightbox-caption {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: var(--ink);
    text-align: center;
    padding-top: 10px;
  }
  .lightbox-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  .lightbox-actions button {
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  .lightbox-close { background: var(--ink); color: var(--paper); }
  .lightbox-delete { background: transparent; color: var(--stamp); text-decoration: underline; }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 30px 0 10px;
  }

  @media (prefers-reduced-motion: reduce) {
    .check-wrap input:checked ~ .stamp { animation: none; opacity: 1; transform: scale(1) rotate(-8deg); }
  }

  .note {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 22px;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<div class="pad">
  <div class="rings">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <div class="date" id="dateLabel">-</div>
    <h1>오늘의 할 일</h1>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0/0</div>
    </div>
  </header>

  <form class="add-row" id="addForm">
    <input type="text" id="taskInput" placeholder="다음 할 일을 적어보세요" maxlength="80" autocomplete="off">
    <button type="submit">추가</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="emptyMsg">아직 할 일이 없어요. 하나 적어볼까요?</div>

  <div class="note">체크하면 도장이 쾅! 찍혀요 · 카메라 아이콘 눌러서 사진도 붙여보세요</div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-card">
    <img id="lightboxImg" src="" alt="첨부한 사진">
    <div class="lightbox-actions">
      <button type="button" class="lightbox-delete" id="lightboxDelete">사진 삭제</button>
      <button type="button" class="lightbox-close" id="lightboxClose">닫기</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo-notepad-tasks';
  let tasks = [];

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    tasks = saved ? JSON.parse(saved) : [];
  } catch (e) {
    tasks = [];
  }

  const listEl = document.getElementById('list');
  const emptyMsg = document.getElementById('emptyMsg');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');
  const dateLabel = document.getElementById('dateLabel');
  const addForm = document.getElementById('addForm');
  const taskInput = document.getElementById('taskInput');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxDelete = document.getElementById('lightboxDelete');
  let lightboxTaskId = null;

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      // 저장 공간이 꽉 찼을 때(사진을 너무 많이 붙였을 때) 등에도 앱은 계속 동작하게 둡니다.
      alert('저장 공간이 가득 찼어요. 사진을 몇 개 지우고 다시 시도해주세요.');
    }
  }

  function setDateLabel() {
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    dateLabel.textContent = `${y}.${m}.${d} (${days[now.getDay()]})`;
  }

  // 사진을 그대로 저장하면 용량이 너무 커서, 작게 줄이고 압축해서 저장합니다.
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
        img.onload = () => {
          const maxSide = 480;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openLightbox(task) {
    lightboxTaskId = task.id;
    lightboxImg.src = task.photo;
    lightbox.hidden = false;
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = '';
    lightboxTaskId = null;
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  lightboxDelete.addEventListener('click', () => {
    const task = tasks.find(t => t.id === lightboxTaskId);
    if (task) {
      task.photo = null;
      save();
      render();
    }
    closeLightbox();
  });

  function render() {
    listEl.innerHTML = '';
    emptyMsg.style.display = tasks.length ? 'none' : 'block';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '');

      const checkWrap = document.createElement('div');
      checkWrap.className = 'check-wrap';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', `${task.text} 완료 표시`);
      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        save();
        render();
      });

      const circle = document.createElement('div');
      circle.className = 'circle';

      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      stamp.textContent = '完';

      checkWrap.appendChild(checkbox);
      checkWrap.appendChild(circle);
      checkWrap.appendChild(stamp);

      // 사진 슬롯: 사진이 있으면 폴라로이드 썸네일(탭하면 확대), 없으면 카메라 아이콘(탭하면 첨부)
      const photoBtn = document.createElement('button');
      photoBtn.type = 'button';
      photoBtn.className = 'photo-slot';

      if (task.photo) {
        photoBtn.setAttribute('aria-label', '첨부한 사진 보기');
        const polaroid = document.createElement('div');
        polaroid.className = 'polaroid';
        polaroid.style.setProperty('--tilt', `${task.tilt || -4}deg`);
        const img = document.createElement('img');
        img.src = task.photo;
        img.alt = '';
        polaroid.appendChild(img);
        photoBtn.appendChild(polaroid);
        photoBtn.addEventListener('click', () => openLightbox(task));
      } else {
        photoBtn.setAttribute('aria-label', '사진 첨부하기');
        const addIcon = document.createElement('div');
        addIcon.className = 'photo-add';
        addIcon.textContent = '📷';
        photoBtn.appendChild(addIcon);
        photoBtn.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.addEventListener('change', async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            try {
              task.photo = await resizeImage(file);
              task.tilt = Math.round(Math.random() * 8 - 4);
              save();
              render();
            } catch (e) {
              alert('사진을 불러오지 못했어요. 다시 시도해주세요.');
            }
          });
          input.click();
        });
      }

      const text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = task.text;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', '할 일 삭제');
      removeBtn.addEventListener('click', () => {
        tasks = tasks.filter(t => t.id !== task.id);
        save();
        render();
      });

      li.appendChild(checkWrap);
      li.appendChild(photoBtn);
      li.appendChild(text);
      li.appendChild(removeBtn);
      listEl.appendChild(li);
    });

    const doneCount = tasks.filter(t => t.done).length;
    const total = tasks.length;
    progressCount.textContent = `${doneCount}/${total}`;
    progressFill.style.width = total ? `${(doneCount / total) * 100}%` : '0%';
  }

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now() + Math.random(), text, done: false, photo: null, tilt: 0 });
    taskInput.value = '';
    save();
    render();
  });

  setDateLabel();
  render();
</script>
</body>
</html>
